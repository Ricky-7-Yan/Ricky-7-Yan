<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-labelledby="title desc">
  <title id="title">System online</title>
  <desc id="desc">A slim neon terminal decoration with a pixel robot, circuit lines, and a pixel spaceship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#020617"/><stop offset=".52" stop-color="#071426"/><stop offset="1" stop-color="#09051a"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-opacity=".06"/></pattern>
    <style>.blink{animation:blink 1.5s step-end infinite}.pulse{animation:pulse 3s ease-in-out infinite}.ship{animation:fly 6s ease-in-out infinite}@keyframes blink{50%{opacity:.2}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes fly{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}</style>
  </defs>
  <rect width="1200" height="90" rx="16" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="88" rx="15" fill="none" stroke="#38bdf8" stroke-opacity=".35"/><rect width="1200" height="90" rx="16" fill="url(#grid)"/>
  <path d="M122 45h178l18-18h105M777 27h105l18 18h178" fill="none" stroke="url(#beam)" stroke-width="2"/>
  <g transform="translate(38 20)"><rect x="10" y="8" width="45" height="36" rx="5" fill="#071426" stroke="#38bdf8" stroke-width="2"/><rect x="18" y="15" width="29" height="17" rx="3" fill="#0ea5e9" opacity=".2"/><rect class="blink" x="24" y="21" width="5" height="5" fill="#22d3ee"/><rect class="blink" x="37" y="21" width="5" height="5" fill="#a855f7"/><path d="M32 8V1M26 1h12M10 26H2M55 26h8M21 44v6M45 44v6" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/></g>
  <g font-family="Consolas,Menlo,monospace" text-anchor="middle"><text x="600" y="36" fill="#4ade80" font-size="17" font-weight="700">● SYSTEM ONLINE</text><text x="600" y="62" fill="#94a3b8" font-size="13" letter-spacing="3">AI AGENTS  /  OPEN SOURCE  /  BUILD  ·  VERIFY  ·  SHARE</text></g>
  <g class="ship" transform="translate(1090 25)"><path d="M0 18h14V9h12V3h22v6h12v9h16v9H60v7H16v-7H0z" fill="#334155"/><path d="M15 18h45v9H15z" fill="#38bdf8"/><path d="M26 9h22v9H26z" fill="#818cf8"/><rect x="36" y="3" width="12" height="6" fill="#c084fc"/><path d="M0 21h-14M-3 14h-20M-2 29h-28" stroke="#22d3ee" stroke-width="3" stroke-dasharray="4 4"/></g>
  <g class="pulse" fill="#a855f7"><rect x="180" y="19" width="5" height="5"/><rect x="1010" y="64" width="5" height="5"/></g>
</svg>
