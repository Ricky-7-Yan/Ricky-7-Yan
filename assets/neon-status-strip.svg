<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="118" viewBox="0 0 1200 118" role="img" aria-labelledby="title desc">
  <title id="title">System online</title>
  <desc id="desc">A neon terminal dashboard with a pixel robot, circuit lines, status controls, and a pixel spaceship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#020617"/><stop offset=".52" stop-color="#071426"/><stop offset="1" stop-color="#09051a"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
    <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".14"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern>
    <style>.blink{animation:blink 1.5s step-end infinite}.pulse{animation:pulse 3s ease-in-out infinite}.ship{animation:fly 6s ease-in-out infinite}.scan{animation:scan 4s linear infinite}@keyframes blink{50%{opacity:.2}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes fly{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}@keyframes scan{0%{transform:translateX(-420px)}100%{transform:translateX(1100px)}}</style>
  </defs>
  <rect width="1200" height="118" rx="16" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="116" rx="15" fill="none" stroke="#38bdf8" stroke-opacity=".42"/><rect width="1200" height="118" rx="16" fill="url(#grid)"/>
  <path d="M3 31h1194M3 91h1194" stroke="#38bdf8" stroke-opacity=".16"/><path d="M14 15V8h7M1186 15V8h-7M14 103v7h7M1186 103v7h-7" fill="none" stroke="#a855f7" stroke-width="2"/>
  <g transform="translate(22 16)"><circle cx="0" cy="0" r="4" fill="#fb7185"/><circle cx="15" cy="0" r="4" fill="#fbbf24"/><circle cx="30" cy="0" r="4" fill="#4ade80"/><text x="47" y="4" fill="#64748b" font-family="Consolas,Menlo,monospace" font-size="11">RICKY://PROFILE</text></g>
  <rect class="scan" x="0" y="32" width="360" height="58" fill="url(#scan)"/>
  <path d="M132 58h150l18-17h105M795 41h105l18 17h150M134 77h98l10 10h92M866 87h92l10-10h98" fill="none" stroke="url(#beam)" stroke-width="2"/>
  <g transform="translate(39 42)"><path d="M5 14L13 6h43l8 8v38l-8 8H13l-8-8z" fill="#071426" stroke="#38bdf8" stroke-width="2"/><rect x="15" y="17" width="39" height="24" rx="3" fill="#0ea5e9" opacity=".18"/><rect class="blink" x="23" y="25" width="6" height="6" fill="#22d3ee"/><rect class="blink" x="41" y="25" width="6" height="6" fill="#a855f7"/><path d="M35 6V0M29 0h12M5 31h-7M64 31h8M20 60v7M50 60v7" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M24 48h22" stroke="#4ade80" stroke-width="3" stroke-dasharray="4 3"/></g>
  <g font-family="Consolas,Menlo,monospace" text-anchor="middle"><text x="600" y="52" fill="#4ade80" font-size="17" font-weight="700">● SYSTEM ONLINE</text><text x="600" y="73" fill="#e2e8f0" font-size="15" font-weight="700">&lt; AI AGENT ENGINEER / OPEN-SOURCE CONTRIBUTOR &gt;</text><text x="600" y="91" fill="#64748b" font-size="11" letter-spacing="2">BUILD  ████████░░  VERIFY  █████████░  SHARE  ██████████</text></g>
  <g class="ship" transform="translate(1084 48)"><path d="M0 18h14V9h12V3h22v6h12v9h16v9H60v7H16v-7H0z" fill="#334155"/><path d="M15 18h45v9H15z" fill="#38bdf8"/><path d="M26 9h22v9H26z" fill="#818cf8"/><rect x="36" y="3" width="12" height="6" fill="#c084fc"/><path d="M0 21h-14M-3 14h-20M-2 29h-28" stroke="#22d3ee" stroke-width="3" stroke-dasharray="4 4"/></g>
  <g font-family="Consolas,Menlo,monospace" font-size="10"><text x="151" y="106" fill="#22d3ee">AGENT://BUILD</text><text x="965" y="106" fill="#c084fc">OSS://CONTRIBUTE</text></g>
  <g class="pulse"><g fill="#a855f7"><rect x="180" y="42" width="5" height="5"/><rect x="1010" y="73" width="5" height="5"/><rect x="264" y="84" width="4" height="4"/></g><g fill="#22d3ee"><circle cx="306" cy="41" r="3"/><circle cx="918" cy="58" r="3"/><circle cx="958" cy="87" r="3"/></g></g>
</svg>
