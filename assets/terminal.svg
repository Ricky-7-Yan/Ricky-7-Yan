<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Who am I terminal</title><desc id="desc">Bilingual introduction for Ricky-7-Yan</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#071426"/></linearGradient><pattern id="lines" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 7.5H8" stroke="#38bdf8" stroke-opacity=".025"/></pattern><filter id="soft"><feGaussianBlur stdDeviation="4"/></filter><style>.cursor{animation:blink 1s step-end infinite}.signal{animation:signal 2.8s ease-in-out infinite}@keyframes blink{50%{opacity:0}}@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}</style></defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#38bdf8" stroke-opacity=".38"/><rect width="1200" height="340" rx="20" fill="url(#lines)"/><path d="M0 48H1200" stroke="#334155"/>
  <circle cx="26" cy="25" r="7" fill="#ef4444"/><circle cx="50" cy="25" r="7" fill="#f59e0b"/><circle cx="74" cy="25" r="7" fill="#22c55e"/><text x="104" y="31" fill="#64748b" font-size="14" font-family="Consolas,Menlo,monospace">ricky@open-source: ~</text>
  <g font-family="Consolas,Menlo,'Microsoft YaHei',monospace" font-size="19"><text x="34" y="84" fill="#4ade80">$ whoami</text><text x="34" y="120" fill="#e2e8f0">Ricky-7-Yan — AI Agent Engineer &amp; Open-Source Contributor</text><text x="34" y="158" fill="#94a3b8">I build auditable AI agents, reliable developer tools, and evidence-grounded workflows.</text><text x="34" y="190" fill="#94a3b8">My focus: reliability · transparency · evaluation · production delivery.</text><text x="34" y="232" fill="#cbd5e1">构建可审计的 AI Agent、可靠的开发者工具，以及以证据为基础的工作流。</text><text x="34" y="264" fill="#cbd5e1">关注可靠性、透明度、评测体系与真实生产交付。</text><text x="34" y="309" fill="#4ade80">$ build --trustworthy --open-source</text><rect class="cursor" x="449" y="292" width="11" height="22" fill="#cbd5e1"/></g>
  <circle class="signal" cx="1152" cy="291" r="8" fill="#a855f7" filter="url(#soft)"/><circle cx="1152" cy="291" r="4" fill="#a855f7"/>
</svg>
